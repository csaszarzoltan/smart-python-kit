[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-cli"
version = "0.1.0"
description = "A CLI project generated by smartvintaawesomekit"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Test", email = "author@example.com"},
]
dependencies = [
    "typer>=0.9.0",
    "rich>=14.0",
]

[project.scripts]
my-cli = "my_cli.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"
