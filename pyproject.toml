[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartvintaawesomekit"
version = "0.9.12"
description = "Smart Python developer toolkit — batteries-included project generator, config, database, and API utilities"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "smartvintaawesomekit contributors"},
]
keywords = ["fastapi", "python", "toolkit", "scaffolding", "micro-saas"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "aiosqlite==0.22.1",
    "uvicorn[standard]==0.52.1",
    "typer==0.27.1",
    "click==8.4.2",
    "httpx==0.28.1",
    "PyJWT==2.13.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
redis = ["redis==8.1.0"]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.2.1",
    "redis==8.1.0",
    "ruff==0.16.1",
    "mypy==2.3.0",
]
test = [
    "pytest==8.4.2,<9",
    "pytest-asyncio==1.4.0,<3",
    "pytest-cov==6.2.1",
    "redis==8.1.0",
    "httpx==0.28.1",
]

[project.scripts]
smartvintaawesomekit = "smartvintaawesomekit.cli:app"

[project.entry-points.pytest11]
smartvintaawesomekit_testing = "smartvintaawesomekit.testing.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "A", "C4", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "ANN202", "ANN401", "B008", "E501", "E702", "I001", "N814", "N817", "SIM102", "TC002"]
"examples/**" = ["ANN001", "ANN201", "ANN202", "ANN401", "B008", "E501", "E702", "I001", "N814", "N817", "SIM102", "TC002"]
"src/smartvintaawesomekit/cli.py" = ["ANN001", "ANN201", "ANN202", "ANN401", "B008", "E501", "E702", "I001", "N814", "N817", "SIM102", "TC002"]
"src/smartvintaawesomekit/api.py" = ["ANN001", "ANN201", "ANN202", "ANN401", "B008", "E501", "E702", "I001", "N814", "N817", "SIM102", "TC002"]
"src/smartvintaawesomekit/app.py" = ["ANN001", "ANN201", "ANN202", "ANN401", "B008", "E501", "E702", "I001", "N814", "N817", "SIM102", "TC002"]
"src/smartvintaawesomekit/cache/base.py" = ["ANN401", "E501"]
"src/smartvintaawesomekit/cache/memory.py" = ["ANN401", "E501"]
"src/smartvintaawesomekit/cache/decorator.py" = ["ANN401", "E501"]
"src/smartvintaawesomekit/cache/invalidation.py" = ["ANN401", "E501"]
"src/smartvintaawesomekit/testing/**" = ["ANN001", "ANN401", "ANN201", "TC002", "TC003"]
"src/smartvintaawesomekit/testing/mocks/**" = ["ANN001", "ANN401"]
"src/smartvintaawesomekit/cli/core.py" = ["E501"]
"src/smartvintaawesomekit/resource_cli.py" = ["E501"]
"src/smartvintaawesomekit/cache/redis.py" = ["ANN401", "E501"]
"tests/test_v090_persistent_resources.py" = ["TC003"]
"src/smartvintaawesomekit/readiness.py" = ["E501", "TC003"]
"tests/test_v092_readiness.py" = ["E501", "TC003"]
"tests/test_v093_upgrade_apply.py" = ["E501", "TC003"]
"tests/test_v094_redis_namespace.py" = ["TC003"]
"src/smartvintaawesomekit/sdk.py" = ["E501", "TC003"]
"tests/test_v095_sdk.py" = ["E501", "TC003"]
"tests/test_v096_doctor_sdk.py" = ["E501", "TC003"]
"tests/test_v097_sdk_types.py" = ["E501", "TC003"]
"tests/test_v098_python_sdk.py" = ["E501", "TC003"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
